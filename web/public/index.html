<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5c400" />
    <title>TravelAgent Fare Calendar</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="TravelAgent home">
        <span class="brand-mark">TA</span>
        <span>TRAVEL<span>AGENT</span></span>
      </a>
      <div class="local-badge">LOCAL DATA</div>
    </header>

    <main>
      <section class="route-panel">
        <div>
          <p class="eyebrow">Fare calendar</p>
          <h1 id="route-title">Loading routes…</h1>
          <p class="subtitle" id="route-subtitle">Latest locally observed fares · 1 adult</p>
        </div>
        <div class="route-controls">
          <div class="route-control">
            <label for="provider-select">Provider</label>
            <select id="provider-select" aria-label="Provider"></select>
          </div>
          <div class="route-control">
            <label for="origin-select">From</label>
            <select id="origin-select" aria-label="Source airport"></select>
          </div>
          <div class="route-control">
            <label for="destination-select">To</label>
            <select id="destination-select" aria-label="Destination airport"></select>
          </div>
        </div>
      </section>

      <section class="toolbar" aria-label="Calendar controls">
        <div class="cabin-tabs" id="cabin-tabs" role="tablist"></div>
        <div class="summary" id="summary"></div>
      </section>

      <section id="calendar" class="calendar" aria-live="polite"></section>
    </main>

    <footer>
      <span id="data-status">Loading local database…</span>
      <span>Prices are observations, not booking guarantees.</span>
    </footer>

    <script type="module" src="/app.ts"></script>
  </body>
</html>
